<svg xmlns="http://www.w3.org/2000/svg" width="<%= large ? 740 : columns ? '100%' : 480 %>" height="99999" class="metrics-terminal <%= large ? 'large' : columns ? 'columns' : '' %> theme-<%= terminal.theme %> density-<%= terminal.density %> <%= terminal.dividers ? 'show-dividers' : '' %> <%= !animated || !terminal.animations ? 'no-animations' : '' %>" role="img" aria-labelledby="report-title">
  <title id="report-title">Metrics report for <%= user.name || user.login %></title>
  <defs><style><%= fonts %></style><%- await include('partials/_icons.ejs') %></defs>
  <style data-optimizable="true"><%= style %></style>
  <style><%= extras.css %></style>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="terminal-report">
      <header class="session-header">
        <%- await include('partials/_prompt.ejs') %>
      </header>
      <% for (const {warning} of warnings) { %><p class="warnings"><%= warning.message %></p><% } %>
      <% for (const {error} of errors) { %><p class="error"><%= error.message %></p><% } %>
      <main>
        <% for (const partial of partials) { %>
          <%- await include('partials/_block.ejs', {partial, content: (await include(`partials/${partial}.ejs`)).trim()}) %>
        <% } %>
      </main>
      <div class="terminal-input" aria-hidden="true">
        <%- await include('partials/_prompt.ejs') %>
        <div class="input-line"><span class="prompt-chevron">❯</span><span class="terminal-cursor"></span></div>
      </div>
      <% if (base.metadata) { %><footer>Generated <%= meta.generated %></footer><% } %>
    </div>
    <div xmlns="http://www.w3.org/1999/xhtml" id="metrics-end"></div>
  </foreignObject>
</svg>
