name: Publish examples (presets)
on:
  schedule:
    - cron: "0 16 1/2 * *"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    if: github.repository == 'ddarkr/github-readme-metrics'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Setup metrics
        run: pnpm install --frozen-lockfile
      - name: Publish presets examples
        run: pnpm run presets publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
