name: Continuous integration

on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-test-analyze:
    name: Build, test and analyze
    if: "!contains(github.event.head_commit.message, '[skip test]')"
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/test.yml

  # Rebuilds only the canonical repository after its checked-out revision passed CI.
  update-indexes:
    name: Publish rebuilt metrics indexes
    runs-on: ubuntu-latest
    needs: [ build-test-analyze ]
    if: github.repository == 'ddarkr/github-readme-metrics'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Setup metrics
        run: pnpm install --frozen-lockfile
      - name: Publish rebuilt metrics indexes
        run: pnpm run build publish

  # Publish only from the canonical master branch, after authorized regeneration.
  docker-master:
    name: Publish master to GitHub registry
    runs-on: ubuntu-latest
    needs: [ update-indexes ]
    if: github.repository == 'ddarkr/github-readme-metrics'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to GitHub registry
        run: echo ${{ github.token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build docker image
        run: docker build -t ghcr.io/ddarkr/github-readme-metrics:master .
      - name: Publish to GitHub registry
        run: docker push ghcr.io/ddarkr/github-readme-metrics:master
      - name: Tag docker image (beta) and publish to GitHub registry
        run: |
          set +e
          METRICS_VERSION=$(node -p "require('./package.json').version.match(/^(\d+\.\d+)\.0-beta$/)?.[1] ?? ''")
          METRICS_VERSION_BETA="$METRICS_VERSION-beta"
          set -e
          if [[ -n "$METRICS_VERSION" ]]; then
            echo "Beta version: v$METRICS_VERSION_BETA"
            docker tag ghcr.io/ddarkr/github-readme-metrics:master ghcr.io/ddarkr/github-readme-metrics:v$METRICS_VERSION_BETA
            docker push ghcr.io/ddarkr/github-readme-metrics:v$METRICS_VERSION_BETA
          fi
      - name: Tag docker image (main) and publish to GitHub registry
        run: |
          docker tag ghcr.io/ddarkr/github-readme-metrics:master ghcr.io/ddarkr/github-readme-metrics:main
          docker push ghcr.io/ddarkr/github-readme-metrics:main

  action-smoke:
    name: Test checked-out action
    runs-on: ubuntu-latest
    needs: [ docker-master ]
    if: github.repository == 'ddarkr/github-readme-metrics'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run action
        uses: ./
        with:
          token: MOCKED_TOKEN
          plugins_errors_fatal: yes
          dryrun: yes
          use_mocked_data: yes
          use_prebuilt_image: no
          verify: yes
