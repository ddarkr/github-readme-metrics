name: Build, test and analyze

on:
  pull_request:
    branches: [ master ]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint checked-out revision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Setup metrics
        run: pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm run linter

  build:
    name: Build and test checked-out revision
    runs-on: ubuntu-latest
    needs: [ lint ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t github-readme-metrics:${{ github.sha }} .
      - name: Run offline regression and widget tests
        run: docker run --rm --entrypoint="" github-readme-metrics:${{ github.sha }} pnpm test

  analyze:
    name: Analyze checked-out revision
    runs-on: ubuntu-latest
    needs: [ lint ]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: ./.github/config/codeql.yml
      - name: Analyze code
        uses: github/codeql-action/analyze@v3