- name: 📓 Featured repositories - Featured repositories
  uses: ddarkr/metrics@latest
  with:
    token: MOCKED_TOKEN
    plugin_repositories: 'yes'
    plugin_repositories_featured: ddarkr/metrics
    use_mocked_data: 'yes'
    verify: 'yes'
- name: 📓 Featured repositories - Pinned repositories
  uses: ddarkr/metrics@latest
  with:
    token: MOCKED_TOKEN
    plugin_repositories: 'yes'
    plugin_repositories_pinned: 2
    use_mocked_data: 'yes'
    verify: 'yes'
