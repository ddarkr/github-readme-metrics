- name: 🗂️ GitHub projects - Project from a repository
  uses: ddarkr/github-readme-metrics@master
  with:
    token: MOCKED_TOKEN
    plugin_projects: 'yes'
    plugin_projects_repositories: ddarkr/github-readme-metrics/projects/1
    plugin_projects_descriptions: 'yes'
    use_mocked_data: 'yes'
    verify: 'yes'
