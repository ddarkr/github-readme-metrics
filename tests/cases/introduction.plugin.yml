- name: 🙋 Introduction - Organization introduction
  uses: ddarkr/metrics@master
  with:
    token: MOCKED_TOKEN
    user: github
    base: header
    plugin_introduction: 'yes'
    use_mocked_data: 'yes'
    verify: 'yes'
- name: 🙋 Introduction - Repository introduction
  uses: ddarkr/metrics@master
  with:
    token: MOCKED_TOKEN
    template: repository
    repo: metrics
    base: header
    plugin_introduction: 'yes'
    use_mocked_data: 'yes'
    verify: 'yes'
