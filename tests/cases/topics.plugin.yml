- name: 📌 Starred topics - Labels
  uses: ddarkr/metrics@master
  with:
    token: NOT_NEEDED
    plugin_topics: 'yes'
    plugin_topics_limit: 12
    use_mocked_data: 'yes'
    verify: 'yes'
- name: 📌 Starred topics - Icons
  uses: ddarkr/metrics@master
  with:
    token: NOT_NEEDED
    plugin_topics: 'yes'
    plugin_topics_limit: 0
    plugin_topics_mode: icons
    use_mocked_data: 'yes'
    verify: 'yes'
